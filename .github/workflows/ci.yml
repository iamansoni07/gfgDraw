name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: Typecheck & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Build Frontend
        run: npm --prefix frontend run build

      - name: Typecheck & Build Server
        run: npm --prefix server run build

      - name: Typecheck & Build MCP Server
        run: npm --prefix mcp-server run build

      - name: Typecheck & Build Standalone React SDK
        run: npm --prefix packages/canvas-sdk run build

  unit-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Engine & Core Unit Tests
        run: npm run test:unit

  e2e-tests:
    name: Headless Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Test Suite
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Test Artifacts (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: docker compose build

